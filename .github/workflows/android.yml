name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Elm
        run: npm install -g elm

      - name: Build web assets
        run: |
          mkdir -p www
          elm make src/Main.elm --optimize --output=www/elm.js
          cp index.html www/index.html
          cp manifest.json www/manifest.json || true
          cp -r icons www/icons || true

      - name: Install Capacitor
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Generate Android icons & splash
        run: npx @capacitor/assets generate --android

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk rss-view.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rss-view-apk
          path: rss-view.apk
          retention-days: 90
